<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title data-i18n="docTitle">Postfix Mail Server + Rspamd + Active Directory Config Generator</title>
    <style>
      pre {
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        padding: 1rem;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 0.95rem;
      }
      .card-header-flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .lang-switcher-container {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body class="bg-light pb-5">
 
    <div class="container mt-4">
      <!-- Header & Language Switcher -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div></div>
        <div class="lang-switcher-container">
          <label for="selectLang" class="form-label mb-0 fw-bold text-secondary">🌐 Language:</label>
          <select id="selectLang" class="form-select form-select-sm w-auto shadow-sm" onchange="changeLanguage(this.value)">
            <option value="en" selected>English</option>
            <option value="zh-TW">繁體中文</option>
            <option value="zh-CN">简体中文</option>
            <option value="vi">Tiếng Việt</option>
          </select>
        </div>
      </div>

      <div class="text-center mb-4">
        <h1 class="h2" data-i18n="mainHeading">Container StartUp Scripts & Compose Generator</h1>
        <h2 class="h5 text-muted"><a href="https://github.com/WilliamFromTW/docker-Postfix-AD" target="_blank" class="text-decoration-none">docker-Postfix-AD (GitHub)</a></h2>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <form class="row g-3" id="form1" onSubmit="return genAllConfigs()">
            
            <div class="col-md-6">
              <label for="inputContainerName" class="form-label font-weight-bold" data-i18n="containerName">Container Name</label>
              <input type="text" class="form-control" id="inputContainerName" placeholder="mailserver" value="mailserver" required>
            </div>

            <div class="col-md-6">
              <label for="inputImageTag" class="form-label font-weight-bold" data-i18n="imageTag">Docker Image Version</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted">inmethod/docker-postfix-ad:</span>
                <input type="text" class="form-control" id="inputImageTag" placeholder="4.0b1" value="4.0b1" required>
              </div>
            </div>

            <div class="col-md-6">
              <label for="inputADIP" class="form-label font-weight-bold" data-i18n="adIp">AD IP (Active Directory Server IP)</label>
              <input type="text" class="form-control" id="inputADIP" data-i18n-placeholder="placeholderAdIp" placeholder="192.168.1.1" required>
            </div>

            <div class="col-md-6">
              <label for="inputSearchBase" class="form-label font-weight-bold" data-i18n="searchBase">AD Search Base</label>
              <input type="text" class="form-control" id="inputSearchBase" data-i18n-placeholder="placeholderSearchBase" placeholder="DC=test,DC=com" required>
            </div>

            <div class="col-md-6">
              <label for="inputBindDN" class="form-label font-weight-bold" data-i18n="bindDn">AD Bind DN</label>
              <input type="text" class="form-control" id="inputBindDN" data-i18n-placeholder="placeholderBindDn" placeholder="CN=ldap,CN=Users,DC=test,DC=com" required>
            </div>

            <div class="col-md-6">
              <label for="inputAliases" class="form-label" data-i18n="aliases">AD Aliases (optional)</label>
              <input type="text" class="form-control" id="inputAliases" data-i18n-placeholder="placeholderAliases" placeholder="OU=aliases,DC=test,DC=com">
            </div>

            <div class="col-md-6">
              <label for="inputDomain" class="form-label font-weight-bold" data-i18n="domain">Email Domain</label>
              <input type="text" class="form-control" id="inputDomain" data-i18n-placeholder="placeholderDomain" placeholder="test.com" required>
            </div>

            <div class="col-md-6">
              <label for="inputMailServerName" class="form-label font-weight-bold" data-i18n="mailServerName">Email Server Name (FQDN)</label>
              <input type="text" class="form-control" id="inputMailServerName" data-i18n-placeholder="placeholderMailServer" placeholder="mail.test.com" required>
            </div>

            <div class="col-md-6">
              <label for="inputSpamEmail" class="form-label" data-i18n="spamEmail">SPAM_EMAIL (optional)</label>
              <input type="email" class="form-control" id="inputSpamEmail" data-i18n-placeholder="placeholderSpam" placeholder="spam@test.com">
            </div>

            <div class="col-md-6">
              <label for="inputPermitNetwork" class="form-label" data-i18n="permitNetwork">Permit Trusted Networks (optional)</label>
              <input type="text" class="form-control" id="inputPermitNetwork" data-i18n-placeholder="placeholderPermitNetwork" placeholder="192.168.1.0/24">
            </div>

            <div class="col-md-6">
              <label for="inputTimeZone" class="form-label font-weight-bold" data-i18n="timeZone">Time Zone</label>
              <input type="text" class="form-control" id="inputTimeZone" placeholder="Asia/Taipei" value="Asia/Taipei" required>
              <div class="form-text"><a href="https://en.wikipedia.org/wiki/List_of_tz_database_time_zones" target="_blank" data-i18n="tzLink">List of Time Zones</a></div>
            </div>

            <div class="col-md-6 d-flex align-items-center">
              <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" id="inputEnableQuota" checked>
                <label class="form-check-label" for="inputEnableQuota" data-i18n="enableQuota">
                  Enable Mailbox Quota Limit (ENABLE_QUOTA)
                </label>
              </div>
            </div>

            <div class="col-12 mt-4 text-center">
              <button class="btn btn-primary btn-lg px-5" type="submit" data-i18n="btnGen">🚀 Generate Configs</button>
            </div>
          </form>
        </div>
      </div>

      <div class="resultCard card shadow-sm d-none">
        <div class="card-header bg-white py-3 card-header-flex">
          <div class="d-flex align-items-center gap-2">
            <label for="outputFormat" class="form-label mb-0 fw-bold" data-i18n="outputFormat">Output Format:</label>
            <select class="form-select w-auto" id="outputFormat" onchange="renderSelectedOutput()">
              <option value="compose" data-i18n="optCompose" selected>🐳 Docker Compose (YAML)</option>
              <option value="docker" data-i18n="optDocker">📦 Docker Run Command</option>
              <option value="podman" data-i18n="optPodman">🦭 Podman Run Command</option>
            </select>
          </div>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btnCopy" onclick="copyCurrentOutput()" data-i18n="btnCopy">
            📋 Copy to Clipboard
          </button>
        </div>
        <div class="card-body">
          <pre id="outputCode" class="m-0"></pre>
        </div>
      </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

      var currentLang = "en";
      var cachedResults = {
        compose: "",
        docker: "",
        podman: ""
      };

      function applyLanguage(lang) {
        if (!translations[lang]) lang = "en";
        currentLang = lang;
        document.documentElement.lang = lang;
        var dict = translations[lang];

        $("[data-i18n]").each(function() {
          var key = $(this).attr("data-i18n");
          if (dict[key]) {
            if ($(this).is("input[type=button], input[type=submit]")) {
              $(this).val(dict[key]);
            } else {
              $(this).html(dict[key]);
            }
          }
        });

        $("[data-i18n-placeholder]").each(function() {
          var key = $(this).attr("data-i18n-placeholder");
          if (dict[key]) {
            $(this).attr("placeholder", dict[key]);
          }
        });

        $("#selectLang").val(lang);

        // 若結果已產生，同步更新產出內容與註解
        if (!$(".resultCard").hasClass("d-none")) {
          genAllConfigs(false);
        }
      }

      function changeLanguage(lang) {
        localStorage.setItem("userLanguage", lang);
        applyLanguage(lang);
      }

      function genAllConfigs(shouldScroll) {
        if (typeof shouldScroll === "undefined") shouldScroll = true;

        var dict = translations[currentLang] || translations.en;
        var containerName = $("#inputContainerName").val().trim() || "mailserver";
        var imageTag = $("#inputImageTag").val().trim() || "4.0b1";
        var image = "inmethod/docker-postfix-ad:" + imageTag;
        var podmanImage = "docker.io/inmethod/docker-postfix-ad:" + imageTag;
        var adIp = $("#inputADIP").val().trim();
        var searchBase = $("#inputSearchBase").val().trim();
        var bindDn = $("#inputBindDN").val().trim();
        var aliases = $("#inputAliases").val().trim();
        var domain = $("#inputDomain").val().trim();
        var mailServerName = $("#inputMailServerName").val().trim();
        var spamEmail = $("#inputSpamEmail").val().trim();
        var permitNetwork = $("#inputPermitNetwork").val().trim();
        var timeZone = $("#inputTimeZone").val().trim() || "Asia/Taipei";
        var enableQuota = $("#inputEnableQuota").is(":checked") ? "true" : "false";

        // Docker / Podman CLI 額外選項
        var cliOptional = "";
        if (aliases !== "") {
          cliOptional += ' -e ALIASES="' + aliases + '" \\\n';
        }
        if (permitNetwork !== "") {
          cliOptional += ' -e MY_NETWORKS="' + permitNetwork.replace(/\//g, "\\/") + '" \\\n';
        }
        if (spamEmail !== "") {
          cliOptional += ' -e SPAM_EMAIL="' + spamEmail + '" \\\n';
        }

        // 1. Docker Run 指令
        var dockerCmd = dict.commentVolumes + "\n" +
          "docker volume create " + containerName + "_vmail\n" +
          "docker volume create " + containerName + "_postfix\n" +
          "docker volume create " + containerName + "_dovecot\n" +
          "docker volume create " + containerName + "_log\n" +
          "docker volume create " + containerName + "_opendkim\n" +
          "docker volume create " + containerName + "_rspamd_conf\n" +
          "docker volume create " + containerName + "_rspamd_var\n\n" +
          dict.commentRun + "\n" +
          "docker run --name " + containerName + " \\\n" +
          " -v /etc/letsencrypt:/etc/letsencrypt \\\n" +
          " -v " + containerName + "_vmail:/home/vmail \\\n" +
          " -v " + containerName + "_opendkim:/etc/opendkim \\\n" +
          " -v " + containerName + "_postfix:/etc/postfix \\\n" +
          " -v " + containerName + "_dovecot:/etc/dovecot \\\n" +
          " -v " + containerName + "_rspamd_conf:/etc/rspamd \\\n" +
          " -v " + containerName + "_rspamd_var:/var/lib/rspamd \\\n" +
          " -v " + containerName + "_log:/var/log \\\n" +
          " -p 25:25 -p 110:110 -p 143:143 -p 465:465 -p 587:587 -p 993:993 -p 995:995 -p 4190:4190 -p 11334:11334 \\\n" +
          " -e DOMAIN_NAME=\"" + domain + "\" \\\n" +
          " -e HOST_NAME=\"" + mailServerName + "\" \\\n" +
          " -e HOST_IP=\"" + adIp + "\" \\\n" +
          " -e SEARCH_BASE=\"" + searchBase + "\" \\\n" +
          " -e BIND_DN=\"" + bindDn + "\" \\\n" +
          " -e BIND_PW=\"<span class=\"text-danger fw-bold\">your_bind_dn_password</span>\" \\\n" +
          " -e TZ=\"" + timeZone + "\" \\\n" +
          " -e ENABLE_QUOTA=\"" + enableQuota + "\" \\\n" +
          cliOptional +
          " -d --restart always --net=host \\\n " +
          image + "\n";

        // 2. Podman Run 指令
        var podmanCmd = dict.commentVolumes + "\n" +
          "podman volume create " + containerName + "_vmail\n" +
          "podman volume create " + containerName + "_postfix\n" +
          "podman volume create " + containerName + "_dovecot\n" +
          "podman volume create " + containerName + "_log\n" +
          "podman volume create " + containerName + "_opendkim\n" +
          "podman volume create " + containerName + "_rspamd_conf\n" +
          "podman volume create " + containerName + "_rspamd_var\n\n" +
          dict.commentRun + "\n" +
          "podman run --name " + containerName + " \\\n" +
          " -v /etc/letsencrypt:/etc/letsencrypt \\\n" +
          " -v " + containerName + "_vmail:/home/vmail \\\n" +
          " -v " + containerName + "_opendkim:/etc/opendkim \\\n" +
          " -v " + containerName + "_postfix:/etc/postfix \\\n" +
          " -v " + containerName + "_dovecot:/etc/dovecot \\\n" +
          " -v " + containerName + "_rspamd_conf:/etc/rspamd \\\n" +
          " -v " + containerName + "_rspamd_var:/var/lib/rspamd \\\n" +
          " -v " + containerName + "_log:/var/log \\\n" +
          " -p 25:25 -p 110:110 -p 143:143 -p 465:465 -p 587:587 -p 993:993 -p 995:995 -p 4190:4190 -p 11334:11334 \\\n" +
          " -e DOMAIN_NAME=\"" + domain + "\" \\\n" +
          " -e HOST_NAME=\"" + mailServerName + "\" \\\n" +
          " -e HOST_IP=\"" + adIp + "\" \\\n" +
          " -e SEARCH_BASE=\"" + searchBase + "\" \\\n" +
          " -e BIND_DN=\"" + bindDn + "\" \\\n" +
          " -e BIND_PW=\"<span class=\"text-danger fw-bold\">your_bind_dn_password</span>\" \\\n" +
          " -e TZ=\"" + timeZone + "\" \\\n" +
          " -e ENABLE_QUOTA=\"" + enableQuota + "\" \\\n" +
          cliOptional +
          " --label=disable -d --restart always --net=host \\\n " +
          podmanImage + "\n";

        // 3. Docker Compose YAML
        var composeEnv = "      - DOMAIN_NAME=" + domain + "\n" +
          "      - HOST_NAME=" + mailServerName + "\n" +
          "      - HOST_IP=" + adIp + "\n" +
          "      - SEARCH_BASE=" + searchBase + "\n" +
          "      - BIND_DN=" + bindDn + "\n" +
          "      - BIND_PW=<span class=\"text-danger fw-bold\">your_bind_dn_password</span>\n" +
          "      - TZ=" + timeZone + "\n" +
          "      - ENABLE_QUOTA=" + enableQuota + "\n";
        
        if (spamEmail !== "") {
          composeEnv += "      - SPAM_EMAIL=" + spamEmail + "\n";
        }
        if (aliases !== "") {
          composeEnv += "      - ALIASES=" + aliases + "\n";
        }
        if (permitNetwork !== "") {
          composeEnv += "      - MY_NETWORKS=" + permitNetwork + "\n";
        }

        var composeYaml = "version: '3.8'\n\n" +
          "services:\n" +
          "  " + containerName + ":\n" +
          "    image: " + image + "\n" +
          "    container_name: " + containerName + "\n" +
          "    restart: always\n" +
          "    network_mode: host\n" +
          "    environment:\n" +
          composeEnv +
          "    volumes:\n" +
          "      - /etc/letsencrypt:/etc/letsencrypt\n" +
          "      - " + containerName + "_vmail:/home/vmail\n" +
          "      - " + containerName + "_opendkim:/etc/opendkim\n" +
          "      - " + containerName + "_postfix:/etc/postfix\n" +
          "      - " + containerName + "_dovecot:/etc/dovecot\n" +
          "      - " + containerName + "_rspamd_conf:/etc/rspamd\n" +
          "      - " + containerName + "_rspamd_var:/var/lib/rspamd\n" +
          "      - " + containerName + "_log:/var/log\n\n" +
          "volumes:\n" +
          "  " + containerName + "_vmail:\n" +
          "  " + containerName + "_opendkim:\n" +
          "  " + containerName + "_postfix:\n" +
          "  " + containerName + "_dovecot:\n" +
          "  " + containerName + "_rspamd_conf:\n" +
          "  " + containerName + "_rspamd_var:\n" +
          "  " + containerName + "_log:\n";

        cachedResults = {
          compose: composeYaml,
          docker: dockerCmd,
          podman: podmanCmd
        };

        $(".resultCard").removeClass("d-none");
        renderSelectedOutput();

        if (shouldScroll) {
          $('html, body').animate({
            scrollTop: $(".resultCard").offset().top - 20
          }, 300);
        }

        return false;
      }

      function renderSelectedOutput() {
        var format = $("#outputFormat").val();
        $("#outputCode").html(cachedResults[format] || "");
      }

      function copyCurrentOutput() {
        var text = $("#outputCode").text();
        if (!text) return;

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(showCopySuccess, fallbackCopy);
        } else {
          fallbackCopy();
        }
      }

      function fallbackCopy() {
        var dict = translations[currentLang] || translations.en;
        var text = $("#outputCode").text();
        var textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          showCopySuccess();
        } catch (err) {
          alert(dict.copyFail || 'Copy failed, please copy manually.');
        }
        document.body.removeChild(textArea);
      }

      function showCopySuccess() {
        var dict = translations[currentLang] || translations.en;
        var $btn = $("#btnCopy");
        var originalText = dict.btnCopy || "📋 Copy to Clipboard";
        $btn.removeClass("btn-outline-secondary").addClass("btn-success").html(dict.copied || "✅ Copied!");
        setTimeout(function() {
          $btn.removeClass("btn-success").addClass("btn-outline-secondary").html(originalText);
        }, 2000);
      }

      $(document).ready(function() {
        // 讀取記錄或預設為英文
        var savedLang = localStorage.getItem("userLanguage") || "en";
        applyLanguage(savedLang);

        // Email Domain 自動連動
        $("#inputDomain").on("input", function() {
          var domain = $(this).val().trim();
          if (domain) {
            $("#inputMailServerName").val("mail." + domain);
            $("#inputSpamEmail").val("spam@" + domain);
          } else {
            $("#inputMailServerName").val("");
            $("#inputSpamEmail").val("");
          }
        });
      });
    </script>
  </body>
</html>
