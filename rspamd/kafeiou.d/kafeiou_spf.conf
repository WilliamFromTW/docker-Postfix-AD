# /etc/rspamd/kafeiou.d/kafeiou_spf.conf
# =========================================================================
# 【說明】：本檔案定義 SPF 檢查的例外 IP 白名單。
# 【載入方式】：由 /etc/rspamd/local.d/spf.conf 透過以下指令引入生效：
