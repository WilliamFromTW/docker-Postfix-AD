name: Build and Push to Docker Hub

on:
  push:
    branches: [ "rspamd" ] 
    
  schedule:
    # 每個月 1 號的 UTC 02:00（台灣時間每月 1 號上午 10:00）執行一次
    - cron: "0 2 1 * *"

  # 支援手動觸發：隨時可以手動點擊「Run workflow」
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 登入 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 建置並推送映像檔
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 建議同時保留專屬分支標籤與最新的 latest 標籤
          tags: inmethod/docker-postfix-ad:latest
